<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px 16px; font: 13px/1.5 system-ui, sans-serif; color: #1a1a1a; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; margin: 8px 0 3px; color: #555; }
  .row { display: flex; gap: 6px; align-items: center; }
  select { flex: 1; padding: 4px; font: inherit; }
  button { width: 100%; margin-top: 14px; padding: 8px; font: inherit; font-weight: 600; border: 0; border-radius: 6px;
           background: #ffd814; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { margin-top: 10px; color: #555; min-height: 1.5em; white-space: pre-wrap; }
  #donate { display: block; margin-top: 10px; text-align: center; color: #0066c0; font-size: 12px; }
  #donate[hidden] { display: none; }
  .note { margin-top: 10px; font-size: 11px; color: #888; }
</style>
</head>
<body>
  <h1>注文履歴CSVエクスポーター</h1>
  <label for="year">年</label>
  <select id="year"></select>
  <label>期間（注文日の月）</label>
  <div class="row">
    <select id="from"></select><span>〜</span><select id="to"></select>
  </div>
  <button id="run">CSVを保存</button>
  <div id="msg"></div>
  <div class="note">Amazon.co.jp（ログイン済み）のタブで使います。データはこのブラウザ内だけで処理され、外部には送信されません。Amazonとは無関係の非公式ツールです。</div>
  <a id="donate" href="#" hidden>☕ 開発を応援する</a>
  <script src="popup.js"></script>
</body>
</html>
